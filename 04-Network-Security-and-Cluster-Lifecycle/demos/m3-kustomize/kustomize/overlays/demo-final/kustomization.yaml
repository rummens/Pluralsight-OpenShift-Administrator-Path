apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-final
resources:
  - ../../base
patches:
  - path: replica-patch.yaml
configMapGenerator:
  - name: app-config
    literals:
      - ENVIRONMENT=demo-final
      - LOG_LEVEL=info
      - REPLICA_COUNT=2
secretGenerator:
  - name: app-secrets
    literals:
      - DB_PASSWORD=s3cr3t
      - API_KEY=globomantics-api-key-demo

