apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: FlowSchema
metadata:
  name: globomantics-frontend-writes
spec:
  matchingPrecedence: 500
  priorityLevelConfiguration:
    name: globomantics-workload-low
  distinguisherMethod:
    type: ByUser
  rules:
  - subjects:
    - kind: Group
      group:
        name: frontend-dev
    resourceRules:
    - verbs: ["create", "update", "patch", "delete"]
      apiGroups: ["apps"]
      resources: ["deployments"]
      namespaces: ["upgrade-readiness-demo"]

