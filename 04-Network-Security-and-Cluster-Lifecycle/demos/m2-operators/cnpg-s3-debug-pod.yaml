apiVersion: v1
kind: Pod
metadata:
  name: s3-debug
  namespace: globomantics-db
  labels:
    app: s3-debug
spec:
  restartPolicy: Never
  containers:
    - name: s3-debug
      image: amazon/aws-cli:latest
      command: ["sleep", "infinity"]
      env:
        # ── MinIO credentials ─────────────────────────────────────────────────
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: minio-backup-creds
              key: ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-backup-creds
              key: SECRET_ACCESS_KEY
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
