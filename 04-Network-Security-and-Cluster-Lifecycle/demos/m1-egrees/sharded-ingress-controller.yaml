apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: sharded-ingress
  namespace: openshift-ingress-operator
spec:
  replicas: 1                          # SNO = 1 node, max 1 replica
  domain: sharded.apps.test.ocp.globomantics.com
  namespaceSelector:
    matchLabels:
      ingress-sharding: active
  endpointPublishingStrategy:
    type: HostNetwork
    hostNetwork:
      httpPort: 81                     # non-conflicting ports
      httpsPort: 444
      statsPort: 1937
