apiVersion: apps/v1
kind: Deployment
metadata:
  name: privileged-demo
  namespace: scc-demo
  labels:
    app: privileged-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: privileged-demo
  template:
    metadata:
      labels:
        app: privileged-demo
    spec:
      containers:
      - name: pause
        image: registry.access.redhat.com/ubi9/ubi-minimal:latest
        command: ["bash","-lc","sleep 3600"]
        securityContext:
          privileged: true
