{{- if .Values.tempo.multitenancy.enabled }}
# When multitenancy mode is "openshift", the tempo-gateway authorizes writes via
# SubjectAccessReview. The collector authenticates with this ServiceAccount's
# token and must hold "create" on the tenant's "traces" resource. The gateway
# keys authorization on apiGroup tempo.grafana.com, resource == tenantName,
# resourceName == "traces".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.collector.serviceAccount }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "tracing-stack.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.collector.serviceAccount }}-tenant-write
  labels:
    {{- include "tracing-stack.labels" . | nindent 4 }}
rules:
  - apiGroups: ["tempo.grafana.com"]
    resources: ["{{ .Values.tempo.multitenancy.tenantName }}"]
    resourceNames: ["traces"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.collector.serviceAccount }}-tenant-write
  labels:
    {{- include "tracing-stack.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.collector.serviceAccount }}-tenant-write
subjects:
  - kind: ServiceAccount
    name: {{ .Values.collector.serviceAccount }}
    namespace: {{ .Values.namespace }}
{{- end }}
