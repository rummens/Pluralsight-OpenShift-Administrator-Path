apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: globomantics
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: registry.access.redhat.com/ubi9/ubi-minimal
        command: ["sleep", "infinity"]
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
