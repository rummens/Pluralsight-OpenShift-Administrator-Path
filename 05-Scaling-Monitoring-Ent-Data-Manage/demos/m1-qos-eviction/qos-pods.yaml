apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed
  namespace: globomantics
spec:
  containers:
  - name: app
    image: registry.access.redhat.com/ubi9/ubi-minimal
    command: ["sleep", "infinity"]
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits:   { cpu: "100m", memory: "128Mi" }
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-burstable
  namespace: globomantics
spec:
  containers:
  - name: app
    image: registry.access.redhat.com/ubi9/ubi-minimal
    command: ["sleep", "infinity"]
    resources:
      requests: { memory: "64Mi" }
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort
  namespace: globomantics
spec:
  containers:
  - name: app
    image: registry.access.redhat.com/ubi9/ubi-minimal
    command: ["sleep", "infinity"]
