apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: globomantics-app
  labels:
    app: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
      - name: sample-app
        image: quay.io/brancz/prometheus-example-app:v0.5.0
        ports:
        - name: web
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: globomantics-app
  labels:
    app: sample-app
spec:
  selector:
    app: sample-app
  ports:
  - name: web
    port: 8080
    targetPort: web
