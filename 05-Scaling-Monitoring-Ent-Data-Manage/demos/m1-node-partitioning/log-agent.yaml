apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-agent
  namespace: globomantics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-agent
  template:
    metadata:
      labels:
        app: log-agent
    spec:
      nodeSelector:
        node-role: infra
      tolerations:
      - key: dedicated
        operator: Equal
        value: infra
        effect: NoSchedule
      containers:
      - name: agent
        image: registry.access.redhat.com/ubi9/ubi-minimal
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
