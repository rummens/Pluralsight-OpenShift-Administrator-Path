apiVersion: v1
kind: ConfigMap
metadata:
  name: quayregistry-manifest
  namespace: {{ .Values.quay.namespace }}
data:
  quayregistry.yaml: |
    apiVersion: quay.redhat.com/v1
    kind: QuayRegistry
    metadata:
      name: {{ .Values.quay.registryName }}
      namespace: {{ .Values.quay.namespace }}
    spec:
      configBundleSecret: quay-config-bundle
      components:
        # Sized for the Globomantics lab cluster (3x16GiB UpCloud nodes).
        # Quay's defaults (replicas: 2, quay-app at 8GiB request) won't
        # schedule when other operators are also running. Single-replica
        # overrides keep the demo small enough to fit and skip the HPA.
        - kind: clair
          managed: true
          overrides:
            replicas: 1
            # Clair indexer is CPU- and memory-hungry: it downloads every
            # layer of every pushed image and runs language-package detectors
            # on each. With 1 CPU / 2 GiB it pegs at 100% and the index_report
            # POSTs from quay-app's secscan worker time out after 600 s, so
            # the Quay UI shows "This manifest has not been indexed yet"
            # indefinitely. 2 CPU / 4 GiB is Quay's canonical Clair sizing
            # and matches what the upstream operator picks when no override
            # is set.
            resources:
              requests: {cpu: 500m, memory: 2Gi}
              limits:   {cpu: "2",  memory: 4Gi}
        - kind: clairpostgres
          managed: true
        - kind: postgres
          managed: true
        - kind: redis
          managed: true
        - kind: route
          managed: true
        - kind: tls
          managed: true
        - kind: mirror
          managed: true
          overrides:
            replicas: 1
            resources:
              requests: {cpu: 250m, memory: 512Mi}
              limits:   {cpu: 500m, memory: 1Gi}
        - kind: monitoring
          managed: true
        - kind: horizontalpodautoscaler
          managed: false
        - kind: quay
          managed: true
          overrides:
            replicas: 1
            # Quay's quay-app pod runs supervisord with ~14 worker processes by
            # default (WORKER_COUNT_WEB=4, WORKER_COUNT_REGISTRY=8,
            # WORKER_COUNT_SECSCAN=2). On a 4 GiB lab pod that overshoots
            # quickly — gunicorn-web stalls, the startup probe sees 502 from
            # nginx, and the kubelet keeps killing the container. Halve the
            # worker counts and give it 6 GiB.
            env:
              # Keep registry+secscan trimmed (those are background workers
              # and don't need the full default), but leave WEB at the stock
              # 4 so the UI stays snappy under interactive load.
              - name: WORKER_COUNT_WEB
                value: "4"
              - name: WORKER_COUNT_REGISTRY
                value: "4"
              - name: WORKER_COUNT_SECSCAN
                value: "1"
            resources:
              requests: {cpu: 500m, memory: 3Gi}
              limits:   {cpu: "2",  memory: 6Gi}
        # Provided externally via the configBundleSecret (MinIO at {{ .Values.minio.host }}:{{ .Values.minio.port }})
        - kind: objectstorage
          managed: false
