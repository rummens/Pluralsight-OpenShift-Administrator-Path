apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: globomantics
  labels:
    app: web
    demo: bottleneck
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: ghcr.io/rummens/pluralsight-globomantics-website:v3
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: globomantics
  labels:
    app: web
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 8080
    targetPort: 8080
