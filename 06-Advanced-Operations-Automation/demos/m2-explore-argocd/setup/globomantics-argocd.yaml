apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: globomantics-argocd
  namespace: globomantics-argocd
spec:
  server:
    route:
      enabled: true
  sso:
    provider: dex
    dex:
      openShiftOAuth: true
  rbac:
    defaultPolicy: 'role:readonly'
    policy: |
      g, cluster-admins, role:admin
    scopes: '[groups]'
